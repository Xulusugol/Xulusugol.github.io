<div id="fumo-map-app">
  <!-- 控制面板 -->
  <div class="map-controls">
    <button @click="switchLayer('district')">行政区划模式</button>
    <button @click="switchLayer('street')">街道打卡模式</button>
    <span>已打卡： / </span>
  </div>
  <!-- 地图容器 -->
  <div id="map-container"></div>
</div>
<!-- 依赖引入 -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.min.js"></script>
<!-- 地图逻辑 -->
<script>
// Vue实例配置
new Vue({
  el: '#fumo-map-app',
  data: {
    map: null,
    currentLayer: 'district',
    visitedCount: 0,
    totalStreets: 0
  },
  async mounted() {
    this.initMap();
    await this.loadGeoData();
    this.initLayers();
    this.calculateProgress();
  },
  methods: {
    initMap() {
      this.map = L.map('map-container', {
        center: [39.904989, 116.405285],
        zoom: 11,
        preferCanvas: true  // 优化大量标记性能
      });
      
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(this.map);
    },
    
    async loadGeoData() {
      const [districtData, streetData] = await Promise.all([
        fetch('/map_data/beijing_district.json').then(r => r.json()),
        fetch('/map_data/beijing_street.json').then(r => r.json())
      ]);
      
      this.districtLayer = this.createDistrictLayer(districtData);
      this.streetLayer = this.createStreetLayer(streetData);
      this.totalStreets = streetData.features.length;
    },
    
    createDistrictLayer(data) {
      return L.geoJSON(data, {
        style: feature => ({
          fillColor: this.getDistrictColor(feature.properties.name),
          weight: 2,
          color: '#ffffff',
          fillOpacity: 0.7
        }),
        onEachFeature: (feature, layer) => {
          layer.bindPopup(`<b>${feature.properties.name}</b>`);
        }
      });
    },
    
    createStreetLayer(data) {
      return L.geoJSON(data, {
        style: { color: '#666', weight: 1 },
        onEachFeature: (feature, layer) => {
          layer.on('click', () => this.handleStreetClick(feature));
        }
      });
    },
    
    switchLayer(layerType) {
      if (this.currentLayer) this[this.currentLayer + 'Layer'].remove();
      this[this.currentLayer = layerType + 'Layer'].addTo(this.map);
    },
    
    getDistrictColor(districtName) {
      return this.visitedDistricts.includes(districtName) ? '#ff6b6b' : '#a5d8ff';
    },
    
    calculateProgress() {
      const visitedStreets = new Set();
      this.posts.forEach(post => {
        if (post.location?.name) visitedStreets.add(post.location.name);
      });
      this.visitedCount = visitedStreets.size;
    }
  }
});
</script>
<!-- 样式定义 -->
<style>
#map-container {
  height: 600px;
  border-radius: 8px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.3);
}

.map-controls {
  margin-bottom: 1rem;
  padding: 10px;
  background: #f8f9fa;
  border-radius: 4px;
}

.map-controls button {
  margin-right: 8px;
  padding: 6px 12px;
  background: #4dabf7;
  color: white;
  border: none;
  border-radius: 4px;
  cursor: pointer;
}
</style>
